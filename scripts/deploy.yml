---
- name: Deploy the demo application
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_env: test
    app_image: "demo-app:latest"
    app_network: tp02-cicd-net
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    env_settings:
      test:
        container: demo-app-test
        host_port: 8081
      prod:
        container: demo-app-prod
        host_port: 8082
  tasks:
    - name: Check that the target environment is valid
      ansible.builtin.assert:
        that:
          - target_env in env_settings
        fail_msg: "target_env must be one of: {{ env_settings.keys() | list | join(', ') }}"
        quiet: true

    - name: Check that the vault secrets were loaded
      ansible.builtin.assert:
        that:
          - vault_app_secret_key is defined
          - vault_api_token is defined
        fail_msg: "Vault secrets are missing: pass -e @vault/secrets.yml with a vault password file"
        quiet: true
      no_log: true

    - name: Ensure the application network exists
      community.docker.docker_network:
        name: "{{ app_network }}"
        state: present

    - name: Run the application container
      community.docker.docker_container:
        name: "{{ env_settings[target_env].container }}"
        image: "{{ app_image }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        networks:
          - name: "{{ app_network }}"
        published_ports:
          - "{{ env_settings[target_env].host_port }}:5000"
        env:
          APP_ENV: "{{ target_env }}"
          SECRET_KEY: "{{ vault_app_secret_key }}"
          API_TOKEN: "{{ vault_api_token }}"
        read_only: true
        tmpfs:
          - /tmp
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
        labels:
          tp02.environment: "{{ target_env }}"
      no_log: true
