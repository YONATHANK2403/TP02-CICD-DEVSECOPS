sonar.projectKey=tp02-demo-app
sonar.projectName=TP02 Demo App
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=app/demo_app
sonar.tests=app/tests
sonar.exclusions=**/__pycache__/**
sonar.python.version=3.12

# Coverage produced by scripts/run-tests.sh (needed by the default Quality Gate)
sonar.python.coverage.reportPaths=reports/coverage.xml

# The scanner itself waits for the Quality Gate and returns an error code when it fails.
# This is what blocks the pipeline (no webhook needed).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
