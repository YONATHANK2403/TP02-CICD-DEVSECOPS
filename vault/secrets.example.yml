---
# Sensitive variables consumed by scripts/deploy.yml.
# vault/secrets.yml must ALWAYS be encrypted (ansible-vault) before being committed.
# `bash scripts/vault.sh init` fills this template with random values and encrypts the result.
vault_app_secret_key: CHANGE_ME_SECRET_KEY
vault_api_token: CHANGE_ME_API_TOKEN
vault_app_admin_password: CHANGE_ME_ADMIN_PASSWORD
